<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="dsaBg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="750" fill="url(#dsaBg1)" rx="16" />

  <!-- Grid overlay -->
  <g opacity="0.4" stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Browser Top Bar -->
  <rect x="0" y="0" width="1200" height="42" fill="#ffffff" rx="16" />
  <rect x="0" y="26" width="1200" height="16" fill="#ffffff" />
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="28" cy="21" r="5.5" fill="#f87171" />
  <circle cx="46" cy="21" r="5.5" fill="#fbbf24" />
  <circle cx="64" cy="21" r="5.5" fill="#34d399" />
  <rect x="360" y="10" width="480" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="600" y="25" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">ursacdsa.vercel.app/index.html</text>

  <!-- Header Section -->
  <g transform="translate(60, 64)">
    <!-- Badge -->
    <rect x="420" y="0" width="240" height="26" rx="13" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="540" y="17" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">COMPUTER SCIENCE EDUCATION</text>

    <!-- Main Title -->
    <text x="540" y="58" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle" letter-spacing="-0.5">Data Structures &amp; Algorithms Workbench</text>
    <text x="540" y="84" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">An interactive academic visualization suite developed to demonstrate fundamental abstract data types,</text>
    <text x="540" y="102" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">memory layouts, algorithmic operations, and asymptotic behavior.</text>

    <!-- Overview Banner Card -->
    <rect x="40" y="122" width="1000" height="110" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
    <text x="65" y="148" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Educational Overview</text>
    <text x="65" y="170" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Data structures provide structured formats for organizing, processing, retrieving, and storing data in computer memory.</text>
    <text x="65" y="186" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Selecting the optimal data structure directly impacts algorithm efficiency, execution time, and spatial memory footprint.</text>
    
    <!-- Prop Pills -->
    <g transform="translate(65, 196)">
      <rect x="0" y="0" width="300" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="12" y="17" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">INSTITUTION:</text>
      <text x="85" y="17" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">URS Antipolo Campus</text>

      <rect x="320" y="0" width="280" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="332" y="17" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">SUBJECT AREA:</text>
      <text x="418" y="17" fill="#1e293b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">CS / IT Core DSA</text>

      <rect x="620" y="0" width="330" height="26" rx="6" fill="#f8fafc" stroke="#e2e8f0" />
      <text x="632" y="17" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">INTERACTIVE MODULES:</text>
      <text x="765" y="17" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">8 Abstract Data Types</text>
    </g>

    <!-- Grid Header -->
    <text x="40" y="260" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Explore Visualization Modules</text>
    <text x="40" y="278" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5">Select a data structure to interact with its runtime memory model and operations:</text>

    <!-- 4x2 Cards Grid -->
    <!-- Row 1 Card 1: Stack -->
    <g transform="translate(40, 292)">
      <rect width="235" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#eff6ff" />
      <path d="M22 28 l8 -4 l8 4 l-8 4 z" fill="#2563eb" />
      <path d="M22 34 l8 -4 l8 4" stroke="#2563eb" stroke-width="2" fill="none" />
      <text x="56" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Stack</text>
      <text x="14" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" width="205">Linear LIFO container with</text>
      <text x="14" y="84" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">constant O(1) Push, Pop, Peek.</text>
      <line x1="14" y1="112" x2="221" y2="112" stroke="#f1f5f9" stroke-width="1" />
      <text x="14" y="132" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">LIFO Model</text>
      <text x="215" y="132" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">Launch →</text>
    </g>

    <!-- Row 1 Card 2: Regular Queue -->
    <g transform="translate(295, 292)">
      <rect width="235" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#eff6ff" />
      <rect x="22" y="24" width="5" height="12" rx="1" fill="#2563eb" />
      <rect x="30" y="24" width="5" height="12" rx="1" fill="#2563eb" />
      <rect x="38" y="24" width="5" height="12" rx="1" fill="#2563eb" />
      <text x="56" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Regular Queue</text>
      <text x="14" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Sequential FIFO pipeline for</text>
      <text x="14" y="84" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">buffering and scheduling.</text>
      <line x1="14" y1="112" x2="221" y2="112" stroke="#f1f5f9" stroke-width="1" />
      <text x="14" y="132" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">FIFO Model</text>
      <text x="215" y="132" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">Launch →</text>
    </g>

    <!-- Row 1 Card 3: Circular Queue -->
    <g transform="translate(550, 292)">
      <rect width="235" height="150" rx="10" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5" filter="url(#cardShadow)" />
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#eff6ff" />
      <circle cx="30" cy="30" r="8" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4 2" />
      <text x="56" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Circular Queue</text>
      <text x="14" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Ring buffer connecting last slot</text>
      <text x="14" y="84" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">to first preventing waste.</text>
      <line x1="14" y1="112" x2="221" y2="112" stroke="#f1f5f9" stroke-width="1" />
      <text x="14" y="132" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">Ring Buffer</text>
      <text x="215" y="132" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">Launch →</text>
    </g>

    <!-- Row 1 Card 4: AVL Tree -->
    <g transform="translate(805, 292)">
      <rect width="235" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
      <rect x="14" y="14" width="32" height="32" rx="8" fill="#eff6ff" />
      <circle cx="30" cy="22" r="3" fill="#2563eb" />
      <circle cx="24" cy="36" r="3" fill="#2563eb" />
      <circle cx="36" cy="36" r="3" fill="#2563eb" />
      <line x1="30" y1="23" x2="25" y2="34" stroke="#2563eb" stroke-width="1.5" />
      <line x1="30" y1="23" x2="35" y2="34" stroke="#2563eb" stroke-width="1.5" />
      <text x="56" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">AVL Tree</text>
      <text x="14" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Self-balancing binary tree</text>
      <text x="14" y="84" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">enforcing Balance Factor ∈ {-1,0,1}.</text>
      <line x1="14" y1="112" x2="221" y2="112" stroke="#f1f5f9" stroke-width="1" />
      <text x="14" y="132" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Height-Balanced</text>
      <text x="215" y="132" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">Launch →</text>
    </g>

    <!-- Row 2 Card 1: Singly Linked List -->
    <g transform="translate(40, 456)">
      <rect width="235" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
      <text x="20" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Singly Linked List</text>
      <text x="20" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Unidirectional node chain linked</text>
      <text x="20" y="84" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">via pointer addresses.</text>
      <line x1="14" y1="112" x2="221" y2="112" stroke="#f1f5f9" stroke-width="1" />
      <text x="20" y="132" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Head → Null</text>
      <text x="215" y="132" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">Launch →</text>
    </g>

    <!-- Row 2 Card 2: Doubly Linked List -->
    <g transform="translate(295, 456)">
      <rect width="235" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
      <text x="20" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Doubly Linked List</text>
      <text x="20" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Bidirectional node chain with</text>
      <text x="20" y="84" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">both prev and next pointers.</text>
      <line x1="14" y1="112" x2="221" y2="112" stroke="#f1f5f9" stroke-width="1" />
      <text x="20" y="132" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Prev ↔ Next</text>
      <text x="215" y="132" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">Launch →</text>
    </g>

    <!-- Row 2 Card 3: Circular Linked List -->
    <g transform="translate(550, 456)">
      <rect width="235" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
      <text x="20" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Circular Linked List</text>
      <text x="20" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Continuous node loop where tail</text>
      <text x="20" y="84" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">points directly back to head.</text>
      <line x1="14" y1="112" x2="221" y2="112" stroke="#f1f5f9" stroke-width="1" />
      <text x="20" y="132" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Tail → Head</text>
      <text x="215" y="132" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">Launch →</text>
    </g>

    <!-- Row 2 Card 4: Priority Queue -->
    <g transform="translate(805, 456)">
      <rect width="235" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#cardShadow)" />
      <text x="20" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Priority Queue</text>
      <text x="20" y="68" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">Ordered queue prioritizing</text>
      <text x="20" y="84" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5">higher ranking keys first.</text>
      <line x1="14" y1="112" x2="221" y2="112" stroke="#f1f5f9" stroke-width="1" />
      <text x="20" y="132" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600">Priority Order</text>
      <text x="215" y="132" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="end">Launch →</text>
    </g>
  </g>
</svg>
