<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b1e" />
      <stop offset="100%" stop-color="#2a1a25" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2128" />
      <stop offset="100%" stop-color="#1d161a" />
    </linearGradient>
    <linearGradient id="accentRose3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad3)" rx="20" />

  <!-- Top App Bar Mockup -->
  <rect x="50" y="40" width="1100" height="64" rx="14" fill="#181517" stroke="#3d2c34" stroke-width="1.5" />
  <circle cx="85" cy="72" r="7" fill="#ef4444" />
  <circle cx="108" cy="72" r="7" fill="#f59e0b" />
  <circle cx="131" cy="72" r="7" fill="#10b981" />

  <text x="600" y="78" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">
    PHOTO BOOTH • THEMES, STICKERS &amp; FRAME CUSTOMIZATION
  </text>

  <!-- Theme Showcase Cards Grid -->
  <g filter="url(#shadow3)">
    <!-- Card 1: Sticker Sets -->
    <rect x="50" y="130" width="530" height="260" rx="18" fill="url(#cardGrad3)" stroke="#4a313e" stroke-width="1.5" />
    <text x="80" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      Interactive Sticker Packs
    </text>
    <text x="80" y="200" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13">
      Themed anime and aesthetic decorative stickers
    </text>

    <!-- Sticker badges -->
    <g transform="translate(80, 230)">
      <rect x="0" y="0" width="105" height="130" rx="12" fill="#3a2533" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="52" cy="48" r="28" fill="#f43f5e" fill-opacity="0.2" />
      <text x="52" y="56" font-size="28" text-anchor="middle">🗡️</text>
      <text x="52" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Mikasa</text>
      <text x="52" y="118" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Scout Pack</text>

      <rect x="120" y="0" width="105" height="130" rx="12" fill="#3a2533" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="172" cy="48" r="28" fill="#f43f5e" fill-opacity="0.2" />
      <text x="172" y="56" font-size="28" text-anchor="middle">⚔️</text>
      <text x="172" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Levi</text>
      <text x="172" y="118" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Captain Pack</text>

      <rect x="240" y="0" width="105" height="130" rx="12" fill="#3a2533" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="292" cy="48" r="28" fill="#f43f5e" fill-opacity="0.2" />
      <text x="292" y="56" font-size="28" text-anchor="middle">⚡</text>
      <text x="292" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Eren</text>
      <text x="292" y="118" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Titan Pack</text>

      <rect x="360" y="0" width="105" height="130" rx="12" fill="#3a2533" stroke="#f43f5e" stroke-width="1.5" />
      <circle cx="412" cy="48" r="28" fill="#f43f5e" fill-opacity="0.2" />
      <text x="412" y="56" font-size="28" text-anchor="middle">✨</text>
      <text x="412" y="102" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Annie</text>
      <text x="412" y="118" fill="#fda4af" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Crystal Pack</text>
    </g>

    <!-- Card 2: Color Customization -->
    <rect x="620" y="130" width="530" height="260" rx="18" fill="url(#cardGrad3)" stroke="#4a313e" stroke-width="1.5" />
    <text x="650" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      Photostrip Palette Selection
    </text>
    <text x="650" y="200" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13">
      Curated strip background colors and custom HEX color picker
    </text>

    <g transform="translate(650, 240)">
      <circle cx="30" cy="40" r="24" fill="#ffffff" stroke="#e11d48" stroke-width="3" />
      <text x="30" y="82" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Snow</text>

      <circle cx="95" cy="40" r="24" fill="#211A1D" stroke="#4a313e" stroke-width="1.5" />
      <text x="95" y="82" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Ink</text>

      <circle cx="160" cy="40" r="24" fill="#FF8FB1" stroke="#4a313e" stroke-width="1.5" />
      <text x="160" y="82" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Pastel Pink</text>

      <circle cx="225" cy="40" r="24" fill="#3b82f6" stroke="#4a313e" stroke-width="1.5" />
      <text x="225" y="82" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Cobalt</text>

      <circle cx="290" cy="40" r="24" fill="#22c55e" stroke="#4a313e" stroke-width="1.5" />
      <text x="290" y="82" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Mint</text>

      <circle cx="355" cy="40" r="24" fill="#f59e0b" stroke="#4a313e" stroke-width="1.5" />
      <text x="355" y="82" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Amber</text>

      <circle cx="420" cy="40" r="24" fill="#8b5cf6" stroke="#4a313e" stroke-width="1.5" />
      <text x="420" y="82" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Lavender</text>
    </g>

    <!-- Bottom Feature Summary Banner -->
    <rect x="50" y="420" width="1100" height="270" rx="18" fill="#181417" stroke="#3d2c34" stroke-width="1.5" />
    <text x="80" y="470" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="700">
      Smart Slot &amp; Sticker Positioning Engine
    </text>
    <text x="80" y="498" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="14">
      Stickers dynamically position at intelligent anchors across each photo frame with non-overlapping bounds.
    </text>

    <!-- Feature badges -->
    <g transform="translate(80, 530)">
      <rect x="0" y="0" width="310" height="110" rx="12" fill="#261d23" stroke="#3f2d37" stroke-width="1" />
      <text x="20" y="38" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="15" font-weight="700">🎯 Anchor Precision</text>
      <text x="20" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Dynamic calculation for top-left, center,</text>
      <text x="20" y="86" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">and bottom corners per slot</text>

      <rect x="340" y="0" width="310" height="110" rx="12" fill="#261d23" stroke="#3f2d37" stroke-width="1" />
      <text x="360" y="38" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="15" font-weight="700">🎨 Responsive Theming</text>
      <text x="360" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Real-time color blending with</text>
      <text x="360" y="86" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Tailwind design token integration</text>

      <rect x="680" y="0" width="340" height="110" rx="12" fill="#261d23" stroke="#3f2d37" stroke-width="1" />
      <text x="700" y="38" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="15" font-weight="700">📸 High-Res Output</text>
      <text x="700" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">Lossless canvas rendering for crisp</text>
      <text x="700" y="86" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">and printable photostrip exports</text>
    </g>

    <text x="1110" y="670" fill="#fda4af" opacity="0.6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">
      [ SCREENSHOT PLACEHOLDER ]
    </text>
  </g>
</svg>
