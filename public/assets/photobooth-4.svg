<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181518" />
      <stop offset="100%" stop-color="#241820" />
    </linearGradient>
    <linearGradient id="accentRose4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#bgGrad4)" rx="20" />

  <!-- Top App Bar Mockup -->
  <rect x="50" y="40" width="1100" height="64" rx="14" fill="#181517" stroke="#3d2c34" stroke-width="1.5" />
  <circle cx="85" cy="72" r="7" fill="#ef4444" />
  <circle cx="108" cy="72" r="7" fill="#f59e0b" />
  <circle cx="131" cy="72" r="7" fill="#10b981" />

  <text x="600" y="78" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">
    PHOTO BOOTH • STANDALONE PHOTOSTRIP EXPORT &amp; DOWNLOAD
  </text>

  <!-- Left: Download & Finished Strip View -->
  <g filter="url(#shadow4)">
    <rect x="50" y="130" width="620" height="560" rx="18" fill="#131012" stroke="#3d2c34" stroke-width="1.5" />
    <text x="80" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      Final Photostrip Isolation
    </text>
    <text x="80" y="198" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">
      Exported cleanly without application background or page containers
    </text>

    <!-- Side-by-side Strips Preview -->
    <g transform="translate(140, 230)">
      <!-- Strip 1: Classic 3-photo vertical -->
      <rect x="0" y="0" width="150" height="380" rx="6" fill="#ffffff" filter="url(#shadow4)" />
      <rect x="12" y="14" width="126" height="96" rx="3" fill="#2d1f27" />
      <circle cx="120" cy="28" r="8" fill="#f43f5e" />
      <rect x="12" y="120" width="126" height="96" rx="3" fill="#3a2732" />
      <circle cx="26" cy="200" r="8" fill="#f59e0b" />
      <rect x="12" y="226" width="126" height="96" rx="3" fill="#2d1f27" />
      <circle cx="120" cy="306" r="8" fill="#3b82f6" />
      <text x="75" y="354" fill="#211a1d" font-family="Georgia, serif" font-style="italic" font-size="10" font-weight="bold" text-anchor="middle">
        PHOTO BOOTH
      </text>
      <text x="75" y="368" fill="#6b7280" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">
        2025.03.20
      </text>

      <!-- Strip 2: 2x2 Quad Strip with Pink Background -->
      <g transform="translate(190, 20)">
        <rect x="0" y="0" width="190" height="340" rx="6" fill="#FF8FB1" filter="url(#shadow4)" />
        <rect x="12" y="14" width="76" height="120" rx="3" fill="#ffffff" />
        <rect x="102" y="14" width="76" height="120" rx="3" fill="#ffffff" />
        <rect x="12" y="144" width="76" height="120" rx="3" fill="#ffffff" />
        <rect x="102" y="144" width="76" height="120" rx="3" fill="#ffffff" />
        
        <circle cx="80" cy="24" r="8" fill="#22c55e" />
        <circle cx="168" cy="254" r="8" fill="#8b5cf6" />
        
        <text x="95" y="295" fill="#211a1d" font-family="Georgia, serif" font-style="italic" font-size="11" font-weight="bold" text-anchor="middle">
          MEMORIES
        </text>
        <text x="95" y="312" fill="#4b5563" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">
          Simple Photo Booth
        </text>
      </g>
    </g>
  </g>

  <!-- Right: Actions & Export Options -->
  <g filter="url(#shadow4)">
    <rect x="690" y="130" width="460" height="560" rx="18" fill="#1b171a" stroke="#3d2c34" stroke-width="1.5" />

    <text x="720" y="180" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      Export &amp; Share
    </text>
    <text x="720" y="204" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">
      High-resolution PNG generation via html2canvas
    </text>

    <!-- Download Card -->
    <rect x="720" y="235" width="400" height="110" rx="14" fill="#281d24" stroke="#e11d48" stroke-width="1.5" />
    <text x="745" y="275" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">
      💾 Instant HD Download
    </text>
    <text x="745" y="302" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13">
      One-click photostrip export with custom watermark &amp; date
    </text>

    <!-- Retake & Re-arrange Card -->
    <rect x="720" y="365" width="400" height="110" rx="14" fill="#221b20" stroke="#3f2d37" stroke-width="1" />
    <text x="745" y="405" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="16" font-weight="600">
      🔄 Retake &amp; Re-arrange
    </text>
    <text x="745" y="432" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13">
      Switch layouts or retake individual photos seamlessly
    </text>

    <!-- Buttons -->
    <rect x="720" y="505" width="400" height="54" rx="27" fill="url(#accentRose4)" />
    <text x="920" y="538" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700" text-anchor="middle">
      Download Photostrip (PNG)
    </text>

    <rect x="720" y="575" width="400" height="50" rx="25" fill="#2d2229" stroke="#523946" stroke-width="1" />
    <text x="920" y="606" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
      Retake Photos
    </text>

    <text x="920" y="658" fill="#fda4af" opacity="0.6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      [ SCREENSHOT PLACEHOLDER ]
    </text>
  </g>
</svg>
