<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b1e" />
      <stop offset="100%" stop-color="#2d1f27" />
    </linearGradient>
    <linearGradient id="camGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2b2629" />
      <stop offset="100%" stop-color="#181517" />
    </linearGradient>
    <linearGradient id="accentRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="glowOverlay" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fda4af" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.05" />
    </linearGradient>
    <filter id="shadow1" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgGrad1)" rx="20" />

  <!-- Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
    <line x1="200" y1="0" x2="200" y2="750" />
    <line x1="400" y1="0" x2="400" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="800" y1="0" x2="800" y2="750" />
    <line x1="1000" y1="0" x2="1000" y2="750" />
  </g>

  <!-- Top App Bar Mockup -->
  <rect x="50" y="40" width="1100" height="64" rx="14" fill="#181517" stroke="#3d2c34" stroke-width="1.5" />
  <circle cx="85" cy="72" r="7" fill="#ef4444" />
  <circle cx="108" cy="72" r="7" fill="#f59e0b" />
  <circle cx="131" cy="72" r="7" fill="#10b981" />

  <text x="600" y="78" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">
    PHOTO BOOTH • LIVE CAMERA &amp; CAPTURE
  </text>
  
  <rect x="1010" y="54" width="115" height="34" rx="17" fill="url(#accentRose)" />
  <text x="1067" y="76" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    ● LIVE FEED
  </text>

  <!-- Main Viewport Mockup -->
  <g filter="url(#shadow1)">
    <!-- Camera Viewfinder -->
    <rect x="50" y="130" width="760" height="560" rx="18" fill="url(#camGrad1)" stroke="#4c333e" stroke-width="1.5" />
    
    <!-- Camera Frame Corners -->
    <path d="M 90 190 L 90 160 L 120 160" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 770 190 L 770 160 L 740 160" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 90 610 L 90 640 L 120 640" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 770 610 L 770 640 L 740 640" fill="none" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round" />

    <!-- Center Reticle -->
    <circle cx="430" cy="380" r="70" fill="none" stroke="#fda4af" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="6 6" />
    <circle cx="430" cy="380" r="6" fill="#f43f5e" />
    <line x1="390" y1="380" x2="415" y2="380" stroke="#f43f5e" stroke-width="2" />
    <line x1="445" y1="380" x2="470" y2="380" stroke="#f43f5e" stroke-width="2" />
    <line x1="430" y1="340" x2="430" y2="365" stroke="#f43f5e" stroke-width="2" />
    <line x1="430" y1="395" x2="430" y2="420" stroke="#f43f5e" stroke-width="2" />

    <!-- Flash & Countdown Indicator -->
    <rect x="355" y="160" width="150" height="40" rx="20" fill="#000000" fill-opacity="0.6" stroke="#f43f5e" stroke-width="1" />
    <text x="430" y="186" fill="#fda4af" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">
      ⏱ 03s AUTO-TIMER
    </text>

    <!-- Camera Bottom Action Bar -->
    <rect x="80" y="600" width="700" height="70" rx="14" fill="#120f11" fill-opacity="0.8" />
    
    <!-- Shutter Button -->
    <circle cx="430" cy="635" r="28" fill="#ffffff" fill-opacity="0.15" />
    <circle cx="430" cy="635" r="22" fill="url(#accentRose)" />
    <circle cx="430" cy="635" r="18" fill="#ffffff" />

    <text x="180" y="641" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      ⚡ Flash: On
    </text>
    <text x="660" y="641" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="end">
      📷 1080p HD Stream
    </text>
  </g>

  <!-- Right Side Panel: Settings Preview -->
  <g filter="url(#shadow1)">
    <rect x="835" y="130" width="315" height="560" rx="18" fill="#1b171a" stroke="#3d2c34" stroke-width="1.5" />

    <text x="865" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      Booth Controls
    </text>
    <text x="865" y="198" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">
      Configure strip &amp; photo capture
    </text>

    <!-- Photo Count Selector -->
    <rect x="865" y="225" width="255" height="76" rx="12" fill="#251f23" stroke="#3f2d37" stroke-width="1" />
    <text x="880" y="250" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
      PHOTOS IN STRIP
    </text>
    
    <!-- Counter chips -->
    <rect x="880" y="262" width="30" height="28" rx="6" fill="#382932" />
    <text x="895" y="281" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">1</text>
    
    <rect x="918" y="262" width="30" height="28" rx="6" fill="#382932" />
    <text x="933" y="281" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">2</text>

    <rect x="956" y="262" width="30" height="28" rx="6" fill="#382932" />
    <text x="971" y="281" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">3</text>

    <rect x="994" y="262" width="30" height="28" rx="6" fill="url(#accentRose)" />
    <text x="1009" y="281" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">4</text>

    <rect x="1032" y="262" width="30" height="28" rx="6" fill="#382932" />
    <text x="1047" y="281" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">6</text>

    <!-- Color Palette -->
    <rect x="865" y="320" width="255" height="96" rx="12" fill="#251f23" stroke="#3f2d37" stroke-width="1" />
    <text x="880" y="345" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
      STRIP COLOR PALETTE
    </text>
    <circle cx="895" cy="380" r="14" fill="#ffffff" stroke="#e11d48" stroke-width="2.5" />
    <circle cx="933" cy="380" r="14" fill="#211A1D" />
    <circle cx="971" cy="380" r="14" fill="#FF8FB1" />
    <circle cx="1009" cy="380" r="14" fill="#3b82f6" />
    <circle cx="1047" cy="380" r="14" fill="#22c55e" />
    <circle cx="1085" cy="380" r="14" fill="#f59e0b" />

    <!-- Theme Stickers -->
    <rect x="865" y="435" width="255" height="90" rx="12" fill="#251f23" stroke="#3f2d37" stroke-width="1" />
    <text x="880" y="460" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
      STICKER PACK
    </text>
    <rect x="880" y="475" width="225" height="34" rx="8" fill="#3f2935" stroke="#f43f5e" stroke-width="1" />
    <text x="992" y="497" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">
      ⚔️ Attack on Titan Pack
    </text>

    <!-- CTA Button -->
    <rect x="865" y="555" width="255" height="54" rx="27" fill="url(#accentRose)" />
    <text x="992" y="588" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700" text-anchor="middle">
      Start Photo Booth
    </text>
    
    <text x="992" y="645" fill="#fda4af" opacity="0.6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
      [ SCREENSHOT PLACEHOLDER ]
    </text>
  </g>
</svg>
