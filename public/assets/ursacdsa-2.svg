<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="dsaBg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#edf2f7" />
    </linearGradient>
    <filter id="stackShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#dsaBg2)" rx="16" />

  <!-- Browser Top Bar -->
  <rect x="0" y="0" width="1200" height="42" fill="#ffffff" rx="16" />
  <rect x="0" y="26" width="1200" height="16" fill="#ffffff" />
  <line x1="0" y1="42" x2="1200" y2="42" stroke="#e2e8f0" stroke-width="1" />
  <circle cx="28" cy="21" r="5.5" fill="#f87171" />
  <circle cx="46" cy="21" r="5.5" fill="#fbbf24" />
  <circle cx="64" cy="21" r="5.5" fill="#34d399" />
  <rect x="360" y="10" width="480" height="22" rx="6" fill="#f1f5f9" stroke="#e2e8f0" stroke-width="1" />
  <text x="600" y="25" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">ursacdsa.vercel.app/stack.html</text>

  <!-- Content -->
  <g transform="translate(80, 58)">
    <!-- Badge -->
    <rect x="375" y="0" width="290" height="24" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1" />
    <text x="520" y="16" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle" letter-spacing="0.5">LINEAR DATA STRUCTURE • LIFO MODEL</text>

    <!-- Main Title -->
    <text x="520" y="52" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" text-anchor="middle">Stack Visualization</text>
    <text x="520" y="74" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">A linear data structure operating under Last-In, First-Out (LIFO) discipline.</text>

    <!-- Properties Card -->
    <rect x="20" y="90" width="1000" height="66" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#stackShadow)" />
    <g transform="translate(45, 102)">
      <text x="0" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">DISCIPLINE</text>
      <text x="0" y="36" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">LIFO (Last-In, First-Out)</text>

      <text x="320" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">PUSH / POP COMPLEXITY</text>
      <text x="320" y="36" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">O(1) Constant Time</text>

      <text x="640" y="16" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700">ACCESS POINT</text>
      <text x="640" y="36" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">Top of Stack only</text>
    </g>

    <!-- Operations & Memory Stage Container -->
    <rect x="20" y="170" width="1000" height="470" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#stackShadow)" />
    
    <text x="45" y="200" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Operations Panel</text>

    <!-- Left Controls Panel -->
    <g transform="translate(45, 220)">
      <text x="0" y="0" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">1. INITIALIZATION &amp; CAPACITY ALLOCATION</text>
      <rect x="0" y="12" width="60" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="30" y="34" fill="#0f172a" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">5</text>
      
      <rect x="70" y="12" width="130" height="34" rx="6" fill="#2563eb" />
      <text x="135" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Allocate Capacity</text>

      <rect x="210" y="12" width="100" height="34" rx="6" fill="#dc2626" />
      <text x="260" y="33" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Reset Stack</text>

      <text x="0" y="80" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">2. MUTATION OPERATIONS</text>
      <rect x="0" y="92" width="140" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="14" y="113" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12">Enter integer value</text>

      <rect x="150" y="92" width="90" height="34" rx="6" fill="#2563eb" />
      <text x="195" y="113" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Push (Insert)</text>

      <rect x="250" y="92" width="90" height="34" rx="6" fill="#e2e8f0" />
      <text x="295" y="113" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pop (Remove)</text>

      <text x="0" y="160" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700">3. STATE QUERIES &amp; INSPECTION</text>
      <rect x="0" y="172" width="60" height="30" rx="6" fill="#f1f5f9" />
      <text x="30" y="191" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Peek</text>

      <rect x="68" y="172" width="70" height="30" rx="6" fill="#f1f5f9" />
      <text x="103" y="191" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">IsEmpty?</text>

      <rect x="146" y="172" width="60" height="30" rx="6" fill="#f1f5f9" />
      <text x="176" y="191" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">IsFull?</text>

      <rect x="214" y="172" width="50" height="30" rx="6" fill="#f1f5f9" />
      <text x="239" y="191" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Size</text>

      <g transform="translate(0, 230)">
        <text x="0" y="0" fill="#2563eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700">Top Element: [2] 42</text>
        <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">Elements: 3 / 5</text>
      </g>
    </g>

    <!-- Right Side: Stack Container Visualization -->
    <g transform="translate(560, 210)">
      <rect x="0" y="0" width="400" height="390" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-dasharray="4 4" />
      <text x="20" y="28" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700">STACK MEMORY STAGE (TOP → BASE)</text>

      <!-- U-Shaped Stack Bucket -->
      <path d="M 120 70 L 120 340 L 280 340 L 280 70" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />

      <!-- Stack Elements -->
      <!-- Element 3 (Top) -->
      <g transform="translate(126, 175)">
        <rect width="148" height="48" rx="6" fill="#2563eb" />
        <text x="74" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">[2] 42</text>
        <!-- Top Pointer Label -->
        <path d="M 160 24 L 195 24" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)" />
        <rect x="195" y="10" width="60" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5" />
        <text x="225" y="27" fill="#b91c1c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">TOP (2)</text>
      </g>

      <!-- Element 2 -->
      <g transform="translate(126, 230)">
        <rect width="148" height="48" rx="6" fill="#3b82f6" />
        <text x="74" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">[1] 25</text>
      </g>

      <!-- Element 1 (Base) -->
      <g transform="translate(126, 285)">
        <rect width="148" height="48" rx="6" fill="#60a5fa" />
        <text x="74" y="29" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700" text-anchor="middle">[0] 10</text>
      </g>
    </g>
  </g>
</svg>
