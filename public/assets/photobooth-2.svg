<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191518" />
      <stop offset="100%" stop-color="#281a24" />
    </linearGradient>
    <linearGradient id="accentRose2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="750" fill="url(#bgGrad2)" rx="20" />

  <!-- Grid Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="450" x2="1200" y2="450" />
    <line x1="0" y1="600" x2="1200" y2="600" />
  </g>

  <!-- Top App Bar Mockup -->
  <rect x="50" y="40" width="1100" height="64" rx="14" fill="#181517" stroke="#3d2c34" stroke-width="1.5" />
  <circle cx="85" cy="72" r="7" fill="#ef4444" />
  <circle cx="108" cy="72" r="7" fill="#f59e0b" />
  <circle cx="131" cy="72" r="7" fill="#10b981" />

  <text x="600" y="78" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="1">
    PHOTO BOOTH • DYNAMIC LAYOUT &amp; STRIP CONFIGURATOR
  </text>

  <!-- Left: Layout Selector Grid -->
  <g filter="url(#shadow2)">
    <rect x="50" y="130" width="460" height="560" rx="18" fill="#1d181b" stroke="#3d2c34" stroke-width="1.5" />
    <text x="80" y="175" fill="#ffffff" font-family="system-ui, sans-serif" font-size="18" font-weight="700">
      Available Layouts
    </text>
    <text x="80" y="198" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="12">
      Dynamically generated based on chosen photo count
    </text>

    <!-- Layout Card 1: 4-Photo Classic Strip (Selected) -->
    <rect x="80" y="225" width="400" height="96" rx="12" fill="#2d1f27" stroke="#e11d48" stroke-width="2" />
    <!-- Miniature preview -->
    <rect x="96" y="237" width="28" height="72" rx="4" fill="#ffffff" />
    <rect x="100" y="242" width="20" height="13" rx="2" fill="#e11d48" />
    <rect x="100" y="258" width="20" height="13" rx="2" fill="#e11d48" />
    <rect x="100" y="274" width="20" height="13" rx="2" fill="#e11d48" />
    <rect x="100" y="290" width="20" height="13" rx="2" fill="#e11d48" />

    <text x="140" y="260" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" font-weight="700">
      Classic 4-Photo Vertical Strip
    </text>
    <text x="140" y="282" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12">
      Traditional vintage booth vertical 1×4 column
    </text>
    <rect x="410" y="242" width="56" height="24" rx="12" fill="#e11d48" />
    <text x="438" y="258" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">ACTIVE</text>

    <!-- Layout Card 2: 2x2 Grid -->
    <rect x="80" y="335" width="400" height="96" rx="12" fill="#231c21" stroke="#3f2d37" stroke-width="1" />
    <!-- Miniature preview -->
    <rect x="96" y="347" width="48" height="72" rx="4" fill="#ffffff" />
    <rect x="100" y="353" width="18" height="26" rx="2" fill="#64748b" />
    <rect x="122" y="353" width="18" height="26" rx="2" fill="#64748b" />
    <rect x="100" y="384" width="18" height="26" rx="2" fill="#64748b" />
    <rect x="122" y="384" width="18" height="26" rx="2" fill="#64748b" />

    <text x="160" y="370" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">
      2×2 Quad Collage
    </text>
    <text x="160" y="392" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      Balanced quad-frame photocard layout
    </text>

    <!-- Layout Card 3: 1-Large + 2-Small Featured -->
    <rect x="80" y="445" width="400" height="96" rx="12" fill="#231c21" stroke="#3f2d37" stroke-width="1" />
    <!-- Miniature preview -->
    <rect x="96" y="457" width="48" height="72" rx="4" fill="#ffffff" />
    <rect x="100" y="463" width="40" height="30" rx="2" fill="#64748b" />
    <rect x="100" y="497" width="18" height="24" rx="2" fill="#64748b" />
    <rect x="122" y="497" width="18" height="24" rx="2" fill="#64748b" />

    <text x="160" y="480" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="15" font-weight="600">
      Featured Hero + Dual Strip
    </text>
    <text x="160" y="502" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      Hero showcase with dual bottom thumbnails
    </text>

    <!-- Layout Card 4: 3x2 Grid -->
    <rect x="80" y="555" width="400" height="96" rx="12" fill="#231c21" stroke="#3f2d37" stroke-width="1" />
    <text x="100" y="595" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="14" font-weight="600">
      + 3×2 &amp; 2×3 Multi-Slot Options
    </text>
    <text x="100" y="618" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      Dynamic smart slot mapping for 6, 8, &amp; 9 photo sets
    </text>
  </g>

  <!-- Right: Photostrip Live Preview -->
  <g filter="url(#shadow2)">
    <rect x="540" y="130" width="610" height="560" rx="18" fill="#141113" stroke="#3d2c34" stroke-width="1.5" />
    <text x="570" y="170" fill="#ffffff" font-family="system-ui, sans-serif" font-size="16" font-weight="700">
      Live Strip Preview (Pure Photostrip Isolation)
    </text>

    <!-- Vintage Photostrip Container -->
    <g transform="translate(680, 195) rotate(-2)">
      <!-- Photostrip Paper -->
      <rect x="0" y="0" width="220" height="460" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
      
      <!-- Frame 1 -->
      <rect x="16" y="18" width="188" height="90" rx="4" fill="#382932" />
      <text x="110" y="68" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PHOTO 1</text>
      <circle cx="184" cy="36" r="10" fill="#f43f5e" fill-opacity="0.8" />

      <!-- Frame 2 -->
      <rect x="16" y="118" width="188" height="90" rx="4" fill="#2c2027" />
      <text x="110" y="168" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PHOTO 2</text>
      <circle cx="36" cy="190" r="10" fill="#f59e0b" fill-opacity="0.8" />

      <!-- Frame 3 -->
      <rect x="16" y="218" width="188" height="90" rx="4" fill="#382932" />
      <text x="110" y="268" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PHOTO 3</text>
      <circle cx="184" cy="290" r="10" fill="#3b82f6" fill-opacity="0.8" />

      <!-- Frame 4 -->
      <rect x="16" y="318" width="188" height="90" rx="4" fill="#2c2027" />
      <text x="110" y="368" fill="#fbcfe8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">PHOTO 4</text>

      <!-- Watermark text -->
      <text x="110" y="438" fill="#1e1b1e" font-family="Georgia, serif" font-style="italic" font-size="13" font-weight="bold" text-anchor="middle">
        Photo Booth • Memory Strip
      </text>
    </g>

    <text x="1110" y="670" fill="#fda4af" opacity="0.6" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="end">
      [ SCREENSHOT PLACEHOLDER ]
    </text>
  </g>
</svg>
