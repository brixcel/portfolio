<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#8f8b7e" />
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#41509a" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1f1e1a" flood-opacity="0.07" />
    </filter>
  </defs>

  <rect width="1200" height="750" fill="#f5f3ee" />

  <!-- Heading -->
  <text x="60" y="72" font-size="30" font-weight="700" fill="#1f1e1a">Frontend deploy pipeline</text>
  <text x="60" y="104" font-size="16" fill="#6b6a63">GitHub Actions → Cloudflare Pages, used by Capability Studio and Learning Platform</text>

  <!-- Column labels -->
  <g font-size="12" font-weight="700" fill="#8f8b7e" letter-spacing="1.5">
    <text x="60" y="160">TRIGGER</text>
    <text x="360" y="160">JOB</text>
    <text x="920" y="160">ENVIRONMENT</text>
  </g>

  <!-- Triggers -->
  <g filter="url(#shadow)">
    <rect x="60" y="190" width="220" height="80" rx="12" fill="#fff" stroke="#dcd8cc" />
    <rect x="60" y="320" width="220" height="80" rx="12" fill="#fff" stroke="#dcd8cc" />
    <rect x="60" y="450" width="220" height="80" rx="12" fill="#fff" stroke="#dcd8cc" />
  </g>
  <g font-size="14" fill="#6b6a63">
    <text x="80" y="222">push to</text>
    <text x="80" y="352">push to</text>
    <text x="80" y="482">pull request</text>
  </g>
  <g font-family="Consolas, Menlo, monospace" font-size="20" font-weight="700" fill="#1f1e1a">
    <text x="80" y="252">main</text>
    <text x="80" y="382">dev</text>
  </g>
  <text x="80" y="510" font-size="14" fill="#1f1e1a">same repo, not a draft</text>

  <!-- Job container -->
  <rect x="360" y="180" width="480" height="380" rx="16" fill="#ebe8df" stroke="#dcd8cc" />
  <text x="384" y="212" font-size="14" fill="#6b6a63">Build and deploy</text>

  <g filter="url(#shadow)">
    <rect x="384" y="230" width="432" height="48" rx="10" fill="#fff" stroke="#dcd8cc" />
    <rect x="384" y="290" width="432" height="48" rx="10" fill="#fff" stroke="#dcd8cc" />
    <rect x="384" y="350" width="432" height="48" rx="10" fill="#fff" stroke="#dcd8cc" />
    <rect x="384" y="410" width="432" height="48" rx="10" fill="#fff" stroke="#dcd8cc" />
    <rect x="384" y="470" width="432" height="64" rx="10" fill="#41509a" />
  </g>
  <g font-size="12" font-weight="700" fill="#8f8b7e">
    <text x="402" y="259">1</text>
    <text x="402" y="319">2</text>
    <text x="402" y="379">3</text>
    <text x="402" y="439">4</text>
  </g>
  <text x="402" y="507" font-size="12" font-weight="700" fill="#c9cff0">5</text>
  <g font-size="15" fill="#1f1e1a">
    <text x="424" y="259">Set up the toolchain</text>
    <text x="424" y="319">Install locked dependencies</text>
    <text x="424" y="379">Typecheck <tspan fill="#6b6a63">· format · lint · test*</tspan></text>
    <text x="424" y="439">Build the frontend</text>
  </g>
  <text x="424" y="498" font-size="15" font-weight="700" fill="#fff">Deploy to Cloudflare Pages</text>
  <text x="424" y="520" font-size="13" fill="#dfe3fa">Wrangler, routed by branch</text>

  <!-- Trigger → job -->
  <g stroke="#8f8b7e" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <path d="M280 230 H352" />
    <path d="M280 360 H352" />
    <path d="M280 490 H352" />
  </g>

  <!-- Environments -->
  <g filter="url(#shadow)">
    <rect x="920" y="190" width="230" height="80" rx="12" fill="#fff" stroke="#41509a" stroke-width="1.5" />
    <rect x="920" y="320" width="230" height="80" rx="12" fill="#fff" stroke="#dcd8cc" />
    <rect x="920" y="450" width="230" height="80" rx="12" fill="#fff" stroke="#dcd8cc" />
  </g>
  <g font-size="17" font-weight="700" fill="#1f1e1a">
    <text x="940" y="224">production</text>
    <text x="940" y="354">development</text>
    <text x="940" y="484">feature preview</text>
  </g>
  <g font-size="13" fill="#41509a">
    <text x="940" y="250">live site</text>
    <text x="940" y="380">dev site for the team</text>
  </g>
  <text x="940" y="510" font-size="13" fill="#41509a">own URL for each pull request</text>

  <!-- Job → environments -->
  <g stroke="#41509a" stroke-width="1.6" fill="none" marker-end="url(#arrowAccent)">
    <path d="M840 502 C880 502 870 230 912 230" />
    <path d="M840 502 C880 502 870 360 912 360" />
    <path d="M840 502 H912" />
  </g>

  <!-- Guardrails -->
  <text x="60" y="618" font-size="12" font-weight="700" fill="#8f8b7e" letter-spacing="1.5">GUARDRAILS</text>
  <g font-size="14" fill="#1f1e1a">
    <rect x="60" y="636" width="270" height="38" rx="19" fill="#fff" stroke="#dcd8cc" />
    <text x="80" y="660">Stale runs cancel themselves</text>
    <rect x="344" y="636" width="250" height="38" rx="19" fill="#fff" stroke="#dcd8cc" />
    <text x="364" y="660">Least-privilege job access</text>
    <rect x="608" y="636" width="220" height="38" rx="19" fill="#fff" stroke="#dcd8cc" />
    <text x="628" y="660">Pinned tool versions</text>
  </g>
  <text x="60" y="712" font-size="13" fill="#8f8b7e">* format check, lint and tests run on Learning Platform; Capability Studio typechecks before building.</text>
</svg>
