<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <defs>
    <linearGradient id="beam" x1="28" y1="8" x2="42" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="12" fill="#1c1917" />

  <!-- Dynamic Light Beam -->
  <polygon points="29,14 44,36 24,36" fill="url(#beam)" />

  <!-- Base -->
  <rect x="8" y="36" width="12" height="3.5" rx="1.75" fill="#f5ead8" />

  <!-- Stem / Ascender of 'b' -->
  <path
    d="M 11.5 36 L 11.5 13 C 11.5 10 13.5 8 16.5 8 L 22 8"
    stroke="#f5ead8"
    stroke-width="3.6"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Arm Joint -->
  <circle cx="22" cy="8" r="2.2" fill="#ea580c" />

  <!-- Lamp Shade -->
  <path d="M 21 6.5 L 29.5 13 L 27 16.3 L 18.5 10 Z" fill="#f5ead8" />

  <!-- Bowl of 'b' -->
  <path
    d="M 13.5 22 C 16 19 20.5 18 24.5 19.5 C 29.5 21.5 32 26.5 30 31.5 C 28 36 23 37.8 18 36.5 C 15 35.6 13.5 34 13.5 34"
    stroke="#f5ead8"
    stroke-width="3.8"
    stroke-linecap="round"
    fill="none"
  />

  <!-- Illuminated Accent Period -->
  <circle cx="38" cy="36" r="3.6" fill="url(#dotGrad)" />
</svg>
